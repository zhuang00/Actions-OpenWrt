name: Build OpenWrt EN7523V2

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_VERSION: openwrt-25.12


jobs:
  build:

    runs-on: ubuntu-26.04

    steps:

    # ==========================================
    # Checkout
    # ==========================================
    - name: Checkout
      uses: actions/checkout@v4


    # ==========================================
    # Dependencies
    # ==========================================
    - name: Install dependencies
      run: |
        sudo apt-get update

        sudo apt-get install -y \
          build-essential \
          clang \
          flex \
          bison \
          g++ \
          gawk \
          gettext \
          git \
          libncurses-dev \
          libssl-dev \
          python3 \
          python3-setuptools \
          rsync \
          unzip \
          zlib1g-dev \
          file \
          wget \
          curl \
          subversion \
          swig \
          time \
          xsltproc \
          libelf-dev \
          ccache

        sudo apt-get clean


    # ==========================================
    # Clone fixed OpenWrt
    # ==========================================
    - name: Clone OpenWrt
      run: |

        git clone \
          --depth=1 \
          --branch="${OPENWRT_VERSION}" \
          https://github.com/openwrt/openwrt.git \
          openwrt

        cd openwrt

        echo "OpenWrt:"
        git describe --tags --always

        echo "Commit:"
        git rev-parse HEAD


    # ==========================================
    # Feeds
    # ==========================================
    - name: Update feeds
      working-directory: openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a


    # ==========================================
    # Check DTS
    # ==========================================
    - name: Check EN7523 DTS
      working-directory: openwrt
      run: |

        echo "Searching EN7523 files"

        find target/linux/airoha \
          -iname '*en7523*' \
          -print


        test -f target/linux/airoha/dts/en7523-evb.dts


        echo "EN7523 DTS OK"


    # ==========================================
    # Copy config
    # ==========================================
    - name: Copy custom config
      run: |

        test -f "$GITHUB_WORKSPACE/.config"


        cp \
          "$GITHUB_WORKSPACE/.config" \
          "$GITHUB_WORKSPACE/openwrt/.config"


        echo ".config copied"


    # ==========================================
    # OpenWrt config
    # ==========================================
    - name: Prepare config
      working-directory: openwrt
      run: |

        make defconfig


        echo "===== Target ====="

        grep '^CONFIG_TARGET_' .config || true


        echo "===== EN7523 ====="

        grep -i en7523 .config || true



    # ==========================================
    # Download
    # ==========================================
    - name: Download sources
      working-directory: openwrt
      run: |

        make download -j$(nproc)



    # ==========================================
    # Kernel auto config
    # ==========================================
    - name: Prepare kernel configuration
      working-directory: openwrt
      run: |

        make target/linux/prepare V=s


        KERNEL_DIR=$(find build_dir \
          -type d \
          -path '*/linux-airoha_en7523/linux-*' \
          | head -1)


        echo "Kernel directory:"
        echo "$KERNEL_DIR"


        test -n "$KERNEL_DIR"


        cd "$KERNEL_DIR"


        make olddefconfig


        echo "Kernel olddefconfig done"



    # ==========================================
    # Build
    # ==========================================
    - name: Build OpenWrt
      working-directory: openwrt
      run: |

        make -j$(nproc) V=s



    # ==========================================
    # Output
    # ==========================================
    - name: Show output
      working-directory: openwrt
      run: |

        echo "===== Firmware ====="

        find bin/targets \
          -type f \
          -print


        echo

        echo "===== DTB ====="


        find build_dir \
          -type f \
          -name 'en7523-evb.dtb' \
          -print || true



    # ==========================================
    # Upload firmware
    # ==========================================
    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:

        name: en7523-firmware

        path: |
          openwrt/bin/targets/airoha/en7523/**

        if-no-files-found: error

        retention-days: 30



    # ==========================================
    # Upload DTS
    # ==========================================
    - name: Upload DTS
      uses: actions/upload-artifact@v4
      with:

        name: en7523-dts

        path: |
          openwrt/target/linux/airoha/dts/en7523-evb.dts

        if-no-files-found: error

        retention-days: 30



    # ==========================================
    # Upload final config
    # ==========================================
    - name: Upload final config
      uses: actions/upload-artifact@v4
      with:

        name: en7523-config

        path: |
          openwrt/.config

        if-no-files-found: error

        retention-days: 30
